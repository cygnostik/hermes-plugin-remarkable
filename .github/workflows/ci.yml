name: Offline release contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Native and cloud protocol / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # rm-lines-sys 1.4.7 requires glibc 2.39+ or macOS 15+.
        # macos-15 is arm64; macos-15-intel exercises the x86_64 wheel.
        os: [windows-2022, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      HERMES_HOME: ${{ runner.temp }}/remarkable-profile
      TMPDIR: ${{ runner.temp }}/remarkable-scratch
      TEMP: ${{ runner.temp }}/remarkable-scratch
      TMP: ${{ runner.temp }}/remarkable-scratch
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create isolated scratch
        run: mkdir -p "$TMPDIR" "$HERMES_HOME"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Install pinned setup tool
        run: 'python -m pip install --only-binary=:all: uv==0.12.15'
      - name: Exercise clean consumer setup (no credentials)
        run: |
          python cli.py setup-cloud
          python cli.py setup-renderer
          python -c "import pathlib, sys; p = pathlib.Path(sys.argv[1]) / 'plugin-data' / 'remarkable' / 'renderer-venv' / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python'); assert p.is_file(); f = open(sys.argv[2], 'a', encoding='utf-8'); f.write('REMARKABLE_TEST_RENDERER_PYTHON=' + str(p) + '\n'); f.close()" "$HERMES_HOME" "$GITHUB_ENV"
      - name: Install pinned test dependencies in isolated runtime
        run: 'uv pip install --python "$REMARKABLE_TEST_RENDERER_PYTHON" --only-binary=:all: -r requirements-test.txt'
      - name: Offline Python and real native renderer contracts
        run: '"$REMARKABLE_TEST_RENDERER_PYTHON" -m pytest tests -q -ra --junitxml="$TMPDIR/python-results.xml"'
      - name: Offline Node protocol, integrity and session contracts
        working-directory: sidecar
        run: npm test
      - name: Confirm setup did not change dependency locks
        run: git diff --exit-code -- sidecar/package-lock.json requirements-render.txt requirements-test.txt
